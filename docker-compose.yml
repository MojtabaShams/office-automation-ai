services:
  # ۱. پایگاه داده PostgreSQL با افزونه برداری pgvector (برای RAG)
  db:
    image: pgvector/pgvector:pg16
    container_name: office_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: office_automation
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d office_automation"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ۲. سرویس Agent (FastAPI + LangGraph)
  ai_agent:
    build:
      context: ./ai-agent
      dockerfile: Dockerfile.dev
    container_name: office_ai_agent
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./ai-agent:/app  # اتصال کدها به داخل داکر برای اعمال در لحظه تغییرات
    environment:
      DATABASE_URL: postgresql://admin:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/office_automation
      SEED_ON_STARTUP: "true"
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      GAPGPT_API_KEY: ${GAPGPT_API_KEY:-}
      GAPGPT_BASE_URL: ${GAPGPT_BASE_URL:-https://api.gapgpt.app/v1}
      AGENT_ENSEMBLE_ENABLED: ${AGENT_ENSEMBLE_ENABLED:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      ADMIN_MOBILE: ${ADMIN_MOBILE:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001
    depends_on:
      db:
        condition: service_healthy

  # ۳. فرانت‌اند سازمانی و مردمی (Turborepo)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: office_frontend
    restart: always
    ports:
      - "3000:3000" # پورت پیش‌فرض پنل ادمین
      - "3001:3001" # پورت پیش‌فرض PWA
    volumes:
      - ./:/app
      - /app/node_modules # جلوگیری از تداخل node_modules ویندوز و لینوکس
    environment:
      - NEXT_PUBLIC_AGENT_API_URL=http://localhost:8000
    depends_on:
      - ai_agent

volumes:
  postgres_data:
